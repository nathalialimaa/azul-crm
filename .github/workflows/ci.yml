name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version='8.24.2'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$download_dir/$archive"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" \
            --output "$download_dir/checksums.txt"
          (cd "$download_dir" && grep -F "  $archive" checksums.txt | sha256sum -c -)
          tar -xzf "$download_dir/$archive" -C "$download_dir"
          sudo install -m 0755 "$download_dir/gitleaks" /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --redact --exit-code 1 --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/public/assets/app.js
      - run: pytest -q
      - run: python -m azul_crm.pipeline.cli demo
      - run: python -m azul_crm.pipeline.cli validate
      - run: python scripts/export_contracts.py
      - run: python -m azul_crm.cli prepare --customers 120
